<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BooruCraft app icon: a picture with a tag hanging off it. Canonical artwork; every PNG,
       .ico and .icns in this folder is generated from it by packaging/icons.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7eb3"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eaf6ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the picture -->
  <g transform="rotate(-8 230 220)">
    <rect x="86" y="96" width="290" height="236" rx="22" fill="#ffffff"/>
    <rect x="108" y="118" width="246" height="192" rx="10" fill="url(#sky)"/>
    <circle cx="300" cy="170" r="26" fill="#ffd166"/>
    <path d="M108 310 L190 214 L246 276 L282 240 L354 310 Z" fill="#5cc28a"/>
    <path d="M108 310 L190 214 L222 251 L160 310 Z" fill="#3fa36f"/>
  </g>
  <!-- the tag -->
  <g transform="rotate(-30 352 360)">
    <path d="M262 316 H410 a22 22 0 0 1 22 22 V382 a22 22 0 0 1 -22 22 H262 L218 360 Z"
          fill="#ffffff" stroke="#3b2a7a" stroke-width="14" stroke-linejoin="round"/>
    <circle cx="258" cy="360" r="12" fill="#3b2a7a"/>
    <rect x="290" y="346" width="112" height="12" rx="6" fill="#7a5cff"/>
    <rect x="290" y="368" width="74" height="12" rx="6" fill="#ff7eb3"/>
  </g>
</svg>
