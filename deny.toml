# cargo-deny configuration. Run through scripts/check.sh.

[graph]
all-features = true

[licenses]
# Dependencies: permissive licenses only, so BooruCraft stays MIT OR Apache-2.0.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Pulled in unmodified by FilmCraft's filmcraft-codecs (its audio decoding), which BooruCraft uses
# for videos as FilmCraft does. Only these crates may be MPL-2.0 (AGENTS.md section 1).
exceptions = [
    { crate = "symphonia", allow = ["MPL-2.0"] },
    { crate = "symphonia-core", allow = ["MPL-2.0"] },
    { crate = "symphonia-metadata", allow = ["MPL-2.0"] },
    { crate = "symphonia-utils-xiph", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-flac", allow = ["MPL-2.0"] },
    { crate = "symphonia-bundle-mp3", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-aac", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-alac", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-pcm", allow = ["MPL-2.0"] },
    { crate = "symphonia-codec-vorbis", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-isomp4", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-ogg", allow = ["MPL-2.0"] },
    { crate = "symphonia-format-riff", allow = ["MPL-2.0"] },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# craft-media (containers) and FilmCraft's video decoders, pinned by commit.
allow-git = ["https://github.com/storytold/craft-libs", "https://github.com/storytold/filmcraft"]
