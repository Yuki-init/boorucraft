[package]
name = "boorucraft"
description = "BooruCraft: a booru-style picture organiser and viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "boorucraft"
path = "src/main.rs"

[dependencies]
boorucraft-ui-egui = { workspace = true }
eframe = { workspace = true }
image = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and version info in boorucraft.exe (build.rs), as FilmCraft does.
winresource = "0.1"
