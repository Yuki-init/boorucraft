name: Release

# Builds every platform's packages and drafts a GitHub Release (v<version> from Cargo.toml) with
# them attached, through craft-release.yml: BooruCraft's copy of the Craft suite's shared release
# workflow (FilmCraft calls the shared one), without its paid macOS runner. The macOS DMG is
# built on a Mac by scripts/release-macos.sh and added to the draft before it is published.
#
# - Run it by hand (Actions ▸ Release ▸ Run workflow) to test: builds are unsigned, and a
#   version like 0.1.0-rc.1 can be given to draft a pre-release.
# - Pushing to the `release` branch makes a real release. Builds are signed once the secrets
#   below are set in the repo's `release` environment; until then Windows builds are unsigned.
on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.1.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/craft-release.yml
    with:
      app-name: boorucraft
      app-title: BooruCraft
      # BooruCraft embeds its own fonts (assets/fonts), not craft-fonts.
      craft-fonts-ref: ""
      version: ${{ inputs.version }}
      # Not built: web (the app reads folders on disk), a headless server, FreeBSD, riscv64.
      has-web: false
      has-server: false
      has-freebsd: false
      has-riscv64: false
    secrets:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
