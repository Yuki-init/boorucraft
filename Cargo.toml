[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
# Layer L0: data types and the query language.
boorucraft-core = { path = "crates/core" }
# Layer L1: the tag list and collections on disk, the in-memory index; XMP sidecars;
# perceptual hashes and duplicate groups.
boorucraft-store = { path = "crates/store" }
boorucraft-xmp = { path = "crates/xmp" }
boorucraft-dedup = { path = "crates/dedup" }
# Layer L2: scanning folders; thumbnails.
boorucraft-index = { path = "crates/index" }
boorucraft-thumbs = { path = "crates/thumbs" }
# Layer L3: the desktop UI.
boorucraft-ui-egui = { path = "crates/ui-egui" }

# Rust crates only (AGENTS.md §2); `cargo xtask rust-only` checks Cargo.lock.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "now"] }
roaring = "0.12"
quick-xml = "0.42"
walkdir = "2"
rayon = "1"
sha2 = "0.11"
md-5 = "0.11"
imagesize = "0.15"
kamadak-exif = "0.6"
tempfile = "3"
# Decoders only, all pure Rust (no AVIF: its decoder is C).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico", "qoi"] }
jxl-oxide = { version = "0.12", features = ["image"] }
# Videos: FilmCraft's media sources (containers and pure-Rust decoders) give sizes and thumbnail
# frames, as in FilmCraft itself. Pinned by commit and updated together with the Craft apps.
filmcraft-codecs = { git = "https://github.com/storytold/filmcraft", rev = "fed0f42fd52012a337d744743a93409c0b1e8f9d" }
filmcraft-media = { git = "https://github.com/storytold/filmcraft", rev = "fed0f42fd52012a337d744743a93409c0b1e8f9d" }
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "fed0f42fd52012a337d744743a93409c0b1e8f9d" }
# Tests only: writing small Matroska videos (craft-media at the revision FilmCraft uses).
craft-media = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0", default-features = false, features = ["matroska", "bitstream"] }
open = "5"
trash = { version = "5", default-features = false }
# File watching: inotify on Linux (FFI declarations only, no C is compiled).
notify = { version = "8", default-features = false }
egui = { version = "0.37", default-features = false }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "x11", "wayland"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

# The video decoders are far too slow for thumbnails below opt-level 3.
[profile.dev.package.filmcraft-h264]
opt-level = 3

[profile.dev.package.filmcraft-hevc]
opt-level = 3

[profile.dev.package.filmcraft-vp8]
opt-level = 3

[profile.dev.package.filmcraft-vp9]
opt-level = 3

[profile.dev.package.filmcraft-av1]
opt-level = 3

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
